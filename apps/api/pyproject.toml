[project]
name = "lore-api"
version = "0.1.0"
description = "Lore — API backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "pycrdt>=0.10",
    "pycrdt-websocket>=0.15",
    "fastembed>=0.4",
    "pgvector>=0.3",
    "psutil>=6.1",
    "httpx>=0.28",
    "python-multipart>=0.0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "asgi-lifespan>=2.1",
    "asyncpg-stubs>=0.31.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: the async engine's pooled connections
# must not outlive the loop they were created on.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lore_api"]
